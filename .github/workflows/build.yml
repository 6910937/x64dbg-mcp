name: Build x64dbg-mcp

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.15+'

      - name: Build x64
        run: |
          cmake -B build64 -G "Visual Studio 17 2022" -A x64 -DXDBG_ARCH=x64
          cmake --build build64 --config Release

      - name: Build x86
        run: |
          cmake -B build86 -G "Visual Studio 17 2022" -A Win32 -DXDBG_ARCH=x86
          cmake --build build86 --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg-mcp-plugins
          path: |
            build64/bin/Release/*.dp64
            build86/bin/Release/*.dp32
